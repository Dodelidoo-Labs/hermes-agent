name: openCDX compatibility

on:
  push:
    branches: [opencdx]
  pull_request:
    branches: [opencdx]
  workflow_dispatch:
  workflow_call:
    inputs:
      base:
        type: string
        default: ''
      candidate:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compatibility:
    if: github.repository == 'Dodelidoo-Labs/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.base || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.candidate != ''
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/upstream-candidate
      - name: Check out exact merge candidate
        if: inputs.candidate != ''
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/upstream-candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
      - name: Install locked Python test dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra anthropic
      - name: Check Python compatibility and generated contracts
        run: bash .github/scripts/check-opencdx.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked frontend dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Check Desktop model picker and renderer types
        working-directory: apps/desktop
        run: |
          npm run test:ui -- src/app/shell/model-edit-submenu.test.tsx
          npm run test:desktop:platforms -- electron/desktop-update-branch.test.ts
          npx tsc -p . --noEmit
          npx tsc -p tsconfig.electron.json --noEmit
