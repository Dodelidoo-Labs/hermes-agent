name: Review upstream Hermes updates

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencdx-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dodelidoo-Labs/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.merge.outputs.base }}
      candidate: ${{ steps.merge.outputs.candidate }}
      upstream: ${{ steps.merge.outputs.upstream }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: opencdx
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream into an isolated candidate
        id: merge
        run: |
          set -euo pipefail
          git fetch https://github.com/NousResearch/hermes-agent.git main
          upstream=$(git rev-parse FETCH_HEAD)
          base=$(git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo 'The maintained branch already contains upstream main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/upstream-${upstream:0:12}-${base:0:12}"
          existing=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if test -n "$existing"; then
            git fetch origin "$branch"
            git merge-base --is-ancestor "$base" FETCH_HEAD
            git merge-base --is-ancestor "$upstream" FETCH_HEAD
            git checkout --detach FETCH_HEAD
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -z "$existing"; then
            # Fork automation is maintained independently. Preserve it exactly, including
            # resolving workflow-only conflicts; import upstream application source normally.
            git -c commit.gpgsign=false merge --no-ff --no-commit "$upstream" || true
            echo '### Upstream automation differences (not imported)' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-status "$base" "$upstream" -- .github/workflows .github/scripts/check-opencdx.sh >> "$GITHUB_STEP_SUMMARY"
            git rm -rf --ignore-unmatch -- .github/workflows .github/scripts/check-opencdx.sh
            git restore --source="$base" --staged --worktree .github/workflows .github/scripts/check-opencdx.sh
            conflicts=$(git diff --name-only --diff-filter=U)
            if test -n "$conflicts"; then
              echo '### Source conflicts require manual resolution' >> "$GITHUB_STEP_SUMMARY"
              echo "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              echo 'No remote branch or PR was modified.' >> "$GITHUB_STEP_SUMMARY"
              git merge --abort
              exit 1
            fi
            # A failed merge without MERGE_HEAD must not become a fabricated integration.
            git rev-parse --verify MERGE_HEAD
            git -c commit.gpgsign=false commit -m "Merge upstream Hermes $upstream; retain fork workflows"
          fi
          # Existing candidates (including human amendments) are revalidated, not replaced.
          git diff --exit-code "$base" HEAD -- .github/workflows .github/scripts/check-opencdx.sh
          candidate=$(git rev-parse HEAD)
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/candidate.bundle" HEAD "^$base"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.merge.outputs.candidate != ''
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 7

  validate:
    needs: prepare
    if: needs.prepare.outputs.candidate != ''
    uses: ./.github/workflows/opencdx-compatibility.yml
    with:
      base: ${{ needs.prepare.outputs.base }}
      candidate: ${{ needs.prepare.outputs.candidate }}

  propose:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job never runs code from the candidate with its write-capable token.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/upstream-candidate
      - name: Publish reviewed candidate and update its pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ needs.prepare.outputs.base }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/upstream-candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          gh auth setup-git
          git fetch origin opencdx
          if test "$(git rev-parse FETCH_HEAD)" != "$BASE"; then
            echo 'Maintained branch moved during validation; rerun against its new head.' >&2
            exit 1
          fi
          branch="automation/upstream-${UPSTREAM:0:12}-${BASE:0:12}"
          # Ordinary push preserves any human amendments made during validation.
          git push origin "$CANDIDATE:refs/heads/$branch"
          body="$RUNNER_TEMP/upstream-pr.md"
          cat > "$body" <<EOF
          Integrates upstream Hermes commit $UPSTREAM into the maintained openCDX branch.

          Exact validated candidate: $CANDIDATE
          Maintained base: $BASE
          Validation: $RUN_URL

          Focused Python compatibility tests, generated contracts, Desktop model-picker tests,
          and renderer type checking passed before this branch was published.
          Review the merged source and any workflow changes before merging this PR.
          This automation never merges into or force-pushes the maintained branch.
          EOF
          pr=$(gh pr list --base opencdx --head "$branch" --state open --json number --jq '.[0].number // empty')
          if test -n "$pr"; then
            gh pr edit "$pr" --title 'Integrate upstream Hermes updates' --body-file "$body"
          else
            if ! gh pr create --base opencdx --head "$branch" --title 'Integrate upstream Hermes updates' --body-file "$body"; then
              echo 'Candidate published; automatic PR creation failed. Check Actions PR permissions or open manually.' >> "$GITHUB_STEP_SUMMARY"
              echo "Open a PR manually: https://github.com/$GH_REPO/compare/opencdx...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
